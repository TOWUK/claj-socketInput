import com.xpdustry.toxopid.spec.ModMetadata
import com.xpdustry.toxopid.spec.ModPlatform

plugins {
  id "java"
  id "com.xpdustry.toxopid" version "4.2.0"
  id "net.kyori.indra.publishing" version "4.0.0"
}

def metadata = ModMetadata.fromJson(file("mod.hjson"))
group = "com.xpdustry.${metadata.name}"
version = metadata.version
description = metadata.description

// Common settings
subprojects {
  apply plugin: "java"
  apply plugin: "com.xpdustry.toxopid"

  sourceSets.main.java.srcDirs = ["src"]
  sourceSets.main.resources.srcDirs = ["resources"]
  toxopid.compileVersion = "v${metadata.minGameVersion}"
  ext.arcNet = "com.github.Anuken.Arc:arcnet:${toxopid.compileVersion}" //toxopid.dependencies.arcnet

  repositories {
    mavenCentral()
    maven { url "https://maven.xpdustry.com/mindustry" }
    maven { url "https://maven.xpdustry.com/releases" }
    maven { url "https://www.jitpack.io" }
  }

  // Force java 1.8
  compileJava {
    targetCompatibility = JavaVersion.VERSION_1_8
    sourceCompatibility = JavaVersion.VERSION_25
    options.encoding = "UTF-8"
    options.release = 8
    options.compilerArgs += ["-Xlint:-options", "-Xlint:unchecked"]
  }

  // Add desugarizer
  dependencies {
    annotationProcessor "com.xpdustry:jabel:1.1.1"
  }

  // Make fat jar for release
  task release(type: Jar, dependsOn: build) {
    def releaseJar = { ModPlatform.ANDROID in toxopid.platforms.get() ? mergeJar : jar }
    dependsOn releaseJar
    manifest.from releaseJar().manifest
    from {
      zipTree(releaseJar().archiveFile)
    }
    // Add dependencies
    from {
      configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    archiveFileName = "${metadata.name}-${project.name}.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir(name)
  }
}

// Disable toxopid testing tasks
allprojects {
  runMindustryDesktop.enabled = false
  runMindustryServer.enabled = false
}


// Projects configuration
project(":common") {
  dependencies {
    compileOnly toxopid.dependencies.arcCore
    compileOnly arcNet
  }
}

project(":api") {
  dependencies {
    implementation project(":common")
    compileOnly toxopid.dependencies.arcCore
    compileOnly arcNet
  }
}

project(":client") {
  toxopid.platforms = [ModPlatform.DESKTOP, ModPlatform.ANDROID]
  compileJava.options.release = 25 // Mindustry is now using Java 17

  dependencies {
    implementation project(":common")
    implementation project(":api")
    compileOnly toxopid.dependencies.arcCore
    compileOnly toxopid.dependencies.mindustryCore
  }

  // Includes mod json and icon
  processResources.from(rootDir) {
    include "mod.hjson"
    include "icon.png"
  }

  // This is badly made... We need to make a fat jar just for dex compilation,
  // as the property only takes one file as argument
  task mergeDependenciesForDexJar(type: Jar) {
    from sourceSets.main.output
    from {
      configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    destinationDirectory = temporaryDir
  }
  dexJar.source = mergeDependenciesForDexJar.archiveFile

  // Includes android dex
  assemble.dependsOn mergeJar

  // For testing
  runMindustryDesktop.enabled = true
  runMindustryDesktop.mods.from mergeDependenciesForDexJar //meh
  task run(dependsOn: runMindustryDesktop) {} //alias
}

project(":server") {
  ext.mainClassName = "com.xpdustry.claj.server.Main"
  toxopid.platforms = [ModPlatform.SERVER]
  compileJava.options.release = 25

  dependencies {
    implementation project(":common")
    implementation toxopid.dependencies.arcCore
    implementation arcNet
    implementation toxopid.dependencies.arcHeadless
  }

  jar {
    manifest.attributes["Main-Class"] = project.mainClassName
    manifest.attributes["Claj-Version"] = metadata.version
    //TODO: use arc-lite
    //exclude "arc/graphics/**", "arc/math/geom/**", "arc/net/dns/**", "arc/util/noise/**"
  }

  task run(type: JavaExec, dependsOn: classes) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = temporaryDir
    args 7000 // default port
    jvmArgs "-DClaj-Version=${metadata.version}" // claj version
  }
}

// To shut up Javadoc
subprojects {
  javadoc.options {
    addStringOption("Xdoclint:none", "-quiet")
    addStringOption("-enable-preview")
    addStringOption("-release", "25")
  }
}

// Publishing
subprojects {
  apply plugin: "net.kyori.indra.publishing"

  signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
  }

  indra {
    javaVersions {
      target(8)
      minimumToolchain(8)
    }

    gpl3OnlyLicense()
    publishReleasesTo("xpdustry", "https://maven.xpdustry.com/releases")

    def repo = metadata.repository.split("/")
    github(repo[0], repo[1]) {
      ci(true)
      issues(true)
      scm(true)
    }

    configurePublications {
      from components.java
      artifact sourcesJar
      artifact javadocJar
      artifact(release) { classifier = "all" }

      pom {
        organization {
          name = "Xpdustry"
          url = "https://www.xpdustry.com"
        }

        developers {
          metadata.author.split(",").each { author ->
            developer {
              id = author.trim()
              url = "https://github.com/${author.trim()}"
            }
          }
        }
      }
    }
  }

  // I want these to only be included when publishing, not all the time...
  task javadocJar(type: Jar, dependsOn: 'javadoc') {
    from javadoc.destinationDir
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
    archiveClassifier = 'javadoc'
  }
  task sourcesJar(type: Jar, dependsOn: 'classes') {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
  }
}
